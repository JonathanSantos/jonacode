<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Jonacode">
  <defs>
    <linearGradient id="jc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#323845"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="jc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#jc-bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#jc-shine)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
  <!-- the "J", drawn as syntax-highlighted lines of code -->
  <g>
    <rect x="62" y="52" width="50" height="22" rx="11" fill="#c678dd"/>
    <rect x="120" y="52" width="74" height="22" rx="11" fill="#61afef"/>
    <rect x="148" y="86" width="46" height="22" rx="11" fill="#98c379"/>
    <rect x="148" y="120" width="46" height="22" rx="11" fill="#d19a66"/>
    <rect x="62" y="154" width="30" height="22" rx="11" fill="#e06c75"/>
    <rect x="148" y="154" width="46" height="22" rx="11" fill="#56b6c2"/>
    <rect x="74" y="188" width="108" height="22" rx="11" fill="#e5c07b"/>
  </g>
  <!-- caret -->
  <rect x="101" y="148" width="8" height="34" rx="4" fill="#528bff"/>
</svg>
